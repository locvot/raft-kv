// Wire definitions for M4's two gRPC services, hosted side by side on the
// same port:
//
//   - RaftInternal: peer-to-peer RequestVote/AppendEntries/InstallSnapshot,
//     a byte-for-byte mirror of raft/rpc.go's Args/Reply structs. This is
//     the "thin gRPC adapter" the RPC/transport section of DECISIONS.md
//     describes — raft.Raft's own logic never imports this package.
//   - KV: the client-facing Get/Put/Delete API from API.md, plus a
//     leader-redirect hint so a client hitting a follower can retry
//     against the right node without probing every peer.
//
// LogEntry.command is an opaque gob encoding of transport.Command — Raft's
// LogEntry.Command is `interface{}`, and the concrete type living in it is
// this package's business, not raft's.
syntax = "proto3";

package raftkvpb;

option go_package = "github.com/locvth/mini-kv/transport/raftkvpb";

service RaftInternal {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
  rpc InstallSnapshot(InstallSnapshotArgs) returns (InstallSnapshotReply);
}

message RequestVoteArgs {
  int64 term = 1;
  int64 candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteReply {
  int64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  int64 term = 1;
  bytes command = 2; // gob-encoded transport.Command
}

message AppendEntriesArgs {
  int64 term = 1;
  int64 leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesReply {
  int64 term = 1;
  bool success = 2;
  int64 conflict_term = 3;
  int64 conflict_index = 4;
}

message InstallSnapshotArgs {
  int64 term = 1;
  int64 leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotReply {
  int64 term = 1;
}

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// leader_hint carries the address of the node this server currently
// believes is leader (empty if unknown) whenever not_leader is true, so a
// client can retry against the right node instead of round-robining.
message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes value = 1;
  bool ok = 2;
  bool not_leader = 3;
  string leader_hint = 4;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  bool not_leader = 1;
  string leader_hint = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool not_leader = 1;
  string leader_hint = 2;
}
